<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة الموظفين</title><style>body{font:15px Tahoma,Arial;background:#f4f6fa;color:#14233d;margin:0}header{background:#14233d;color:white;padding:20px}main{max-width:960px;margin:22px auto;padding:0 15px}.box{background:white;border:1px solid #e2e7ef;border-radius:12px;padding:20px;margin-bottom:16px}input,select,textarea{padding:10px;border:1px solid #ccd5e1;border-radius:8px;margin:5px;max-width:100%;box-sizing:border-box}button{background:#2356a8;color:white;border:0;padding:11px 15px;border-radius:8px;cursor:pointer;margin:5px}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}#message{color:#a83242;white-space:pre-wrap}.muted{color:#66758a}label{display:inline-block;margin:5px}</style></head><body><header><h2>نظام الموظفين والإجازات</h2></header><main><section class="box" id="loginBox"><h3>تسجيل الدخول</h3><form id="loginForm"><input type="text" id="email" placeholder="البريد الإلكتروني أو رقم الموظف" required autocomplete="username"><input type="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password"><button>دخول</button></form></section><section id="dashboard" class="hidden"><div class="box"><b id="identity"></b><button id="logout">تسجيل الخروج</button></div><section id="admin" class="box hidden"><h3>إنشاء حساب مستخدم — للمسؤول فقط</h3><form id="userForm"><input type="email" id="newEmail" placeholder="بريد المدير أو المحاسب (غير مطلوب للموظف)"><input type="password" id="newPassword" placeholder="كلمة مرور فريدة 12 حرفاً أو أكثر" minlength="12" required><select id="newRole"><option value="employee">موظف</option><option value="manager">مدير</option><option value="accountant">محاسب</option><option value="admin">مسؤول</option></select><input id="empNumber" placeholder="رقم الموظف (إلزامي للموظف)"><button id="createUserButton">إنشاء الحساب</button></form><p id="userMessage" role="status" aria-live="polite" style="font-weight:bold"></p></section><section id="staffBox" class="box hidden"><h3>دليل الموظفين</h3><div id="staff"></div></section><section id="leaveBox" class="box hidden"><h3>طلب إجازة</h3><form id="leaveForm"><select id="kind"><option>اعتيادية</option><option>مرضية</option><option>طارئة</option><option>بدون راتب</option></select><label>من <input type="date" id="starts" required></label><label>إلى <input type="date" id="ends" required></label><input id="reason" placeholder="السبب (اختياري)"><button>إرسال الطلب</button></form></section><section class="box"><h3>طلبات الإجازة</h3><div id="leaves"></div></section></section><p id="message" role="status"></p><p class="muted">نسخة أولية: لا ترسل كلمات المرور لأي شخص. يوصى بإضافة حماية ضد محاولات الدخول المتكررة قبل الاستخدام الواسع.</p></main><script>
const $=id=>document.getElementById(id);let current=null;
$('newRole').addEventListener('change',()=>{const employee=$('newRole').value==='employee';$('newEmail').required=!employee;$('newEmail').disabled=employee;$('empNumber').required=employee;});$('newRole').dispatchEvent(new Event('change'));

function msg(t){$('message').textContent=t}
async function api(path,options={}){const response=await fetch('/api'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const data=await response.json();if(!response.ok)throw Error(data.detail||'حدث خطأ');return data}
function td(text){const el=document.createElement('td');el.textContent=text??'';return el}
async function refresh(){try{current=await api('/me');$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden');$('identity').textContent=current.email+' — '+({admin:'مسؤول',manager:'مدير',accountant:'محاسب',employee:'موظف'}[current.role]);$('admin').classList.toggle('hidden',current.role!=='admin');$('staffBox').classList.toggle('hidden',current.role==='employee');$('leaveBox').classList.toggle('hidden',current.role!=='employee');if(current.role!=='employee'){const data=await api('/staff');const table=document.createElement('table');const head=document.createElement('tr');['الرقم','الاسم','الصفة'].forEach(t=>{const th=document.createElement('th');th.textContent=t;head.append(th)});table.append(head);data.employees.forEach(e=>{const row=document.createElement('tr');row.append(td(e.employee_number),td(e.full_name),td(e.job_title));table.append(row)});$('staff').replaceChildren(table)}await loadLeaves()}catch(e){current=null;$('loginBox').classList.remove('hidden');$('dashboard').classList.add('hidden')}}
async function loadLeaves(){const data=await api('/leaves');const table=document.createElement('table');const head=document.createElement('tr');['الموظف','النوع','من','إلى','الحالة','الإجراء'].forEach(t=>{const th=document.createElement('th');th.textContent=t;head.append(th)});table.append(head);data.leaves.forEach(l=>{const row=document.createElement('tr');row.append(td(l.name),td(l.kind),td(l.starts),td(l.ends),td(l.status));const actions=td('');if(l.status==='pending'&&['manager','admin'].includes(current.role)){for(const [action,label] of [['approved','موافقة'],['rejected','رفض']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{try{await api('/leaves/'+l.id+'/'+action,{method:'POST'});msg('تم تحديث الطلب');await loadLeaves()}catch(e){msg(e.message)}};actions.append(btn)}}row.append(actions);table.append(row)});$('leaves').replaceChildren(table)}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('password').value='';msg('');await refresh()}catch(err){msg(err.message)}};
$('logout').onclick=async()=>{await api('/logout',{method:'POST'});location.reload()};
$('userForm').onsubmit=async e=>{e.preventDefault();const feedback=$('userMessage'),button=$('createUserButton');feedback.textContent='جاري إنشاء الحساب...';feedback.style.color='#2356a8';button.disabled=true;try{await api('/users',{method:'POST',body:JSON.stringify({email:$('newEmail').value,password:$('newPassword').value,role:$('newRole').value,employee_number:$('empNumber').value.trim()||null})});$('userForm').reset();feedback.style.color='#17643b';feedback.textContent='تم إنشاء الحساب بنجاح'}catch(err){feedback.style.color='#a83242';feedback.textContent='تعذر إنشاء الحساب: '+err.message}finally{button.disabled=false}};
$('leaveForm').onsubmit=async e=>{e.preventDefault();try{await api('/leaves',{method:'POST',body:JSON.stringify({kind:$('kind').value,starts:$('starts').value,ends:$('ends').value,reason:$('reason').value})});$('leaveForm').reset();msg('تم إرسال الطلب للمدير');await loadLeaves()}catch(err){msg(err.message)}};
refresh();
</script></body></html>
