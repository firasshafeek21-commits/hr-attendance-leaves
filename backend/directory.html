<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل الموظفين - الإدارة</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f3f6fa;color:#18253a;margin:0}header{background:#14233d;color:#fff;padding:22px}main{max-width:950px;margin:25px auto;padding:0 16px}.panel{background:#fff;padding:20px;border-radius:14px;border:1px solid #dfe6ee}input{padding:12px;border:1px solid #bac6d4;border-radius:8px;max-width:100%;width:360px}button{padding:12px 20px;background:#2356a8;color:white;border:0;border-radius:8px;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{padding:12px;text-align:right;border-bottom:1px solid #e1e6ee}th{background:#f0f4f9}.muted{color:#64748b}#status{margin:14px 0}a{color:#2356a8}</style></head><body><header><h2>دليل الموظفين — للإدارة فقط</h2></header><main><section class="panel"><p>هذه صفحة إدارية تجريبية. أدخل رمز الإدارة الخاص بالخادم لعرض الموظفين. لا تشارك الرمز مع الموظفين ولا تستخدم هذه الصفحة على جهاز مشترك.</p><form id="login"><input id="token" type="password" required autocomplete="off" placeholder="رمز الإدارة HR_ADMIN_TOKEN"> <button type="submit">عرض الموظفين</button></form><p id="status" role="status" class="muted">لن تظهر أي بيانات قبل التحقق.</p><div id="result"></div></section></main><script>
const form=document.getElementById('login'),result=document.getElementById('result'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();result.replaceChildren();status.textContent='جاري التحقق...';const token=document.getElementById('token').value;try{const response=await fetch('/employees',{headers:{'X-Admin-Token':token},cache:'no-store'});if(!response.ok)throw new Error(response.status===401?'رمز الإدارة غير صحيح':response.status===503?'قاعدة البيانات غير جاهزة':'تعذر تحميل الموظفين');const data=await response.json();status.textContent='عدد الموظفين: '+data.count;const table=document.createElement('table');const head=document.createElement('thead'),tr=document.createElement('tr');['رقم الموظف','اسم الموظف','الصفة الوظيفية'].forEach(t=>{const th=document.createElement('th');th.textContent=t;tr.append(th)});head.append(tr);table.append(head);const body=document.createElement('tbody');data.employees.forEach(emp=>{const row=document.createElement('tr');[emp.employee_number,emp.full_name,emp.job_title].forEach(v=>{const td=document.createElement('td');td.textContent=v??'';row.append(td)});body.append(row)});table.append(body);result.append(table)}catch(err){status.textContent=err.message}finally{document.getElementById('token').value=''}});
</script></body></html>
